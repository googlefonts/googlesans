    "ກີ໌ຂີ໌ຄີ໌ຆີ໌ງີ໌ຈີ໌ຉີ໌ຊີ໌ຌີ໌ຍີ໌ຎີ໌ຏີ໌ຐີ໌ຑີ໌ຒີ໌ຓີ໌ດີ໌ຕີ໌ຖີ໌ທີ໌ຘີ໌ນີ໌ບີ໌ປີ໌ຜີ໌ຝີ໌ພີ໌ຟີ໌ຠີ໌ມີ໌ຢີ໌ຣີ໌ລີ໌ວີ໌ຨີ໌ຩີ໌ສີ໌ຫີ໌ອີ໌ຮີ໌ຬີ໌ໜີ໌ໝີ໌ໞີ໌ໟີ໌",
