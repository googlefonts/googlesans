    "ମାତ୍ର ୧୭ବର୍ଷ ବୟସରେ ରୁପେଲି ପର୍ଦ୍ଦାରେ ଅଭିନୟ ଆରମ୍ଭ କରିଥିଲେ । ପିତା ରାଜକିଶୋରଙ୍କ ଛାତ୍ର 'କେଦାର ଗୁରୁ' ସିନ୍ଦୂର ବିନ୍ଦୁ ନାମକ ଚଳଚ୍ଚିତ୍ର ଆରମ୍ଭ କରୁଥିଲେ । ସେହି ସମୟରେ ମହାଶ୍ୱେତା ନୃତ୍ୟ ଶିକ୍ଷା କରୁଥିବାରୁ, କେଦାର ତାଙ୍କ ଚଳଚ୍ଚିତ୍ରରେ ମହାଶ୍ୱେତା ଜଣେ ନୃତ୍ୟଶିଳ୍ପୀ ଭାବରେ କାମ କରିବାକୁ ରାଜକିଶୋରଙ୍କୁ ଅନୁରୋଧ କରିଥିଲେ । ଅନିଚ୍ଛା ସତ୍ତ୍ୱେ ବାପାଙ୍କ ପ୍ରେରଣାରେ ମହାଶ୍ୱେତା ସେଥିରେ କାମ କରିଥିଲେ । ସେହି ଚଳଚ୍ଚିତ୍ରରେ କାମ କରିବା ସମୟରେ ରାଜନ୍ କିନ୍ନାଗୀ ଓ ପ୍ରଶାନ୍ତ ନନ୍ଦ ତାଙ୍କୁ ଶେଷ ଶ୍ରାବଣ ଚଳଚ୍ଚିତ୍ରରେ ଅଭିନୟ କରିବାର ପ୍ରସ୍ତାବ ଦେଇଥିଲେ । ସେ ୧୯୭୬ ମସିହାରେ ଶେଷ ଶ୍ରାବଣରୁ ପ୍ରଥମ ସିନେମା ଅଭିନୟ ଆରମ୍ଭ କରିଥିଲେ । ମହାଶ୍ୱେତା, ବର୍ତ୍ତମାନ ସୁଦ୍ଧା ୫୦ରୁ ଓଡ଼ିଆ ତଥା ବଙ୍ଗଳା ଓ ତେଲୁଗୁ ସିନେମାରେ ମଧ୍ୟ ଅଭିନୟ କରିସାରିଛନ୍ତି । ସେ ଉଭୟ କଳାତ୍ମକ ଓ ବ୍ୟବସାୟିକ ଚଳଚ୍ଚିତ୍ରରେ ନିଜର ଅଭିନୟ ଦକ୍ଷତା ପ୍ରତିପାଦନ କରିପାରିଛନ୍ତି । ଓଡ଼ିଆ ଚଳଚ୍ଚିତ୍ରରେ ପ୍ରଶାନ୍ତ ନନ୍ଦ, ଉତ୍ତମ ମହାନ୍ତି ଓ ଶ୍ରୀରାମ ପଣ୍ଡାଙ୍କ ସହ ତାଙ୍କ ଯୋଡ଼ି ଲୋକପ୍ରିୟ ହୋଇଥିଲା । ୧୯୯୧ ମସିହାରେ ସେ ବଙ୍ଗଳା ଚଳଚ୍ଚିତ୍ରରେ ଅଭିନୟ କରିବା ଆରମ୍ଭ କରିଥିଲେ । \"ସଜନୀ ଗୋ ସଜନୀ\", \"ସୁଜନ ସଖୀ\", ଅରନ୍ୟୋର ଅଧିକାର\", \"କଥା ଛିଲୋ\" ଓ \"ନ୍ୟାୟ ଚକ୍ର\" ଆଦି ଲୋକପ୍ରିୟ ବଙ୍ଗଳା ଚଳଚ୍ଚିତ୍ରରେ ସେ ଅଭିନୟ କରିଥିଲେ । ସେ ଓଡ଼ିଶାର ପ୍ରଥମ ଅଭିନେତ୍ରୀ ଭାବରେ ୧୯୭୮ ମସିହାରେ \"ପ୍ରାଣାମ ଖରେଦୁ\" ନାମକ ଏକ ତେଲୁଗୁ ଚଳଚ୍ଚିତ୍ରରେ ଅଭିନୟ କରିଥିଲେ । ଏହି ଚଳଚ୍ଚିତ୍ରରେ ତାଙ୍କ ବିପକ୍ଷରେ ଚିରଞ୍ଜିବୀ ଅଭିନୟ କରିଥିଲେ । ସୋନି ଟିଭିର ହିନ୍ଦୀ ଧାରବାହିକ \"ଚମତ୍କାର\"ରେ ସେ ଅଭିନେତା ଫାରୁକ୍ ଶେଖଙ୍କ ବିପକ୍ଷରେ ଅଭିନୟ କରିଥିଲେ ।",
