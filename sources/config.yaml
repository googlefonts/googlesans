familyName: Google Sans

sources:
  - GoogleSans.designspace
  - GoogleSans-Italic.designspace

recipe:
  ../fonts/.intermediate/GoogleSans[GRAD,opsz,wght].ttf:
    - source: GoogleSans.designspace
    - operation: buildVariable
      args: --no-auto-use-my-metrics
    - operation: fix
      args: --skip-fvar-instances
    - operation: hbsubset
  ../fonts/.intermediate/GoogleSans-Italic[GRAD,opsz,wght].ttf:
    - source: GoogleSans-Italic.designspace
    - operation: buildVariable
      args: --no-auto-use-my-metrics
    - operation: fix
      args: --skip-fvar-instances
    - operation: hbsubset

stat:
  GoogleSans[GRAD,opsz,wght].ttf:
    - name: Optical Size
      tag: opsz
      values:
        - flags: 2
          name: Max
          value: 18.0
        - flags: 0
          name: Text
          value: 17.0
    - name: Weight
      tag: wght
      values:
        - flags: 2
          linkedValue: 700.0
          name: Regular
          value: 400.0
        - flags: 0
          name: Medium
          value: 500.0
        - flags: 0
          name: Bold
          value: 700.0
    - name: Grade
      tag: GRAD
      values:
        - flags: 2
          name: Normal
          value: 0.0
        - flags: 0
          name: Grade-50
          value: -50.0
        - flags: 0
          name: Grade200
          value: 200.0
    - name: Italic
      tag: ital
      values:
        - flags: 2
          name: Regular
          value: 0.0
          linkedValue: 1.0
  GoogleSans-Italic[GRAD,opsz,wght].ttf:
