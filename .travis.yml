language: generic
sudo: required

matrix:
  include:
    - dist: bionic
      env: TOX_ENV=static-font-QA
      before_install:
        - sudo apt update
        - sudo apt install python3-dev python3-pip python3-venv
        - pip3 --version
      install:
        - python3 --version
        - pip3 --version
        - pip3 install --upgrade pip
        - make setup
        - pip3 install --user --upgrade fontbakery
      script:
        - make gs-static
        - fontbakery --version
        - make test-fb-static-expert
    - dist: bionic
      env: TOX_ENV=variable-font-QA
      before_install:
        - sudo apt update
        - sudo apt install python3-dev python3-pip python3-venv
        - pip3 --version
      install:
        - python3 --version
        - pip3 --version
        - pip3 install --upgrade pip
        - make setup
        - pip3 install --user --upgrade fontbakery
      script:
        - make gs-vf
        - fontbakery --version
        - make test-fb-vf-expert
