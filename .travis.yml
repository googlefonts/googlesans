language: python
before_install:
  - sudo apt-get update
  - sudo apt-get install -y jq
  - sudo apt-get install -y libfreetype6-dev libglib2.0-dev libcairo2-dev
  - curl -O "https://www.freedesktop.org/software/harfbuzz/release/harfbuzz-2.3.0.tar.bz2"
  - tar -xjvf "harfbuzz-2.3.0.tar.bz2"
  - cd harfbuzz-2.3.0
  - ./configure --with-cairo=yes
  - make
  - cd util
  - PATH=$(pwd):$PATH
  - cd ../..

matrix:
  include:
    - python: 3.7
      dist: xenial
      env: TOX_ENV=static-font-compiles
      install: pip install --upgrade fontmake
      script: 
        - fontmake -g source/GoogleSans-Text/GoogleSansText-Beta.glyphs --interpolate -o ttf
        - fontmake -g source/GoogleSans-Text/GoogleSansText-Italic-Beta.glyphs --interpolate -o ttf
    - python: 3.7
      dist: xenial
      env: TOX_ENV=variable-font-compiles
      install: 
        - pip install --upgrade fontmake
        - pip install git+https://www.github.com/m4rc1e/tools
      script: 
        - mv source source-new
        - git checkout master source/
        # Generate from master
        - mkdir old-fonts
        - fontmake -g source/GoogleSans-Text/GoogleSansText-Beta.glyphs -o variable --output-path old-fonts/GoogleSansText-Roman-VF.ttf
        - fontmake -g source/GoogleSans-Text/GoogleSansText-Italic-Beta.glyphs -o variable --output-path old-fonts/GoogleSansText-Italic-VF.ttf
        # Generate from this branch
        - mkdir new-fonts
        - fontmake -g source-new/GoogleSans-Text/GoogleSansText-Beta.glyphs -o variable --output-path new-fonts/GoogleSansText-Roman-VF.ttf
        - fontmake -g source-new/GoogleSans-Text/GoogleSansText-Italic-Beta.glyphs -o variable --output-path new-fonts/GoogleSansText-Italic-VF.ttf
        # Test fonts
        - gftools qa -f new-fonts/*.ttf -fb new-fonts/*.ttf --fontbakery --diffbrowsers --diffenator -o out -ogh --out-url https://github.com/$TRAVIS_REPO_SLUG/pulls/$TRAVIS_PULL_REQUEST


notifications:
  email: false
