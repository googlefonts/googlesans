language: generic

matrix:
  include:
    - dist: bionic
      env: TOX_ENV=static-font-QA
      install: 
        - python3 --version
        - python3 -m pip --version
        - python3 -m pip install --upgrade pip
        - make setup
        - python3 -m pip install --upgrade fontbakery 
      script:
        - make gs-static
        - fontbakery --version
        - fontbakery check-profile qa/check-googlesans.py build/GoogleSans/static/*.ttf
    - dist: bionic
      env: TOX_ENV=variable-font-QA
      install:
        - python3 --version
        - python3 -m pip --version
        - python3 -m pip install --upgrade pip
        - make setup
        - python3 -m pip install --upgrade fontbakery
      script:
        - make gs-vf
        - fontbakery --version
        - fontbakery check-profile qa/check-googlesans.py build/GoogleSans/variable/*.ttf
