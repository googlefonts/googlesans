on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - name: Configuration
        id: config
        uses: f-actions/font-setup@master
        with:
          projectname: "Google Sans"
          sourcepath: "source"
          buildpath: "build/GoogleSans"
          dependpath: "requirements.txt"
          py-version: ${{ matrix.python-version }}
          buildcommand: "make -j"
      - name: Check out ${{ steps.config.outputs.projectname }} source repository
        uses: actions/checkout@v3
      - name: Set env variables
        id: vars
        run: echo ::set-output name=tag::${GITHUB_REF#refs/*/}
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ steps.config.outputs.py-version }}
          cache: "pip"
          cache-dependency-path: "requirements*.txt"
      - name: Install Python build dependencies
        uses: py-actions/py-dependency-install@v2
        with:
          update-wheel: "true"
          update-setuptools: "true"
      - name: Build fonts
        run: ${{ steps.config.outputs.buildcommand }}
      - name: Remove intermediate UFO master / instance directories
        run: |
          make clean-ufo
      - name: Create build artifact zip archive
        run: zip GoogleSans-${{ steps.vars.outputs.tag }}.zip -r ${{ steps.config.outputs.buildpath }}
      - name: Create Google Sans release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Google Sans ${{ github.ref }}
          body: |
            Please see the root of the repository for the CHANGELOG.md
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./GoogleSans-${{ steps.vars.outputs.tag }}.zip
          asset_name: GoogleSans-${{ steps.vars.outputs.tag }}.zip
          asset_content_type: application/zip
