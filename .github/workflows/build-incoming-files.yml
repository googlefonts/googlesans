name: Build Incoming Files

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - main # Push events on main branch
      - "build/**" # Push events to branches matching refs/heads/build/[ANYTHING]
      - "build-*" # Push events to branches matching refs/heads/build-[ANYTHING]
    paths:
      - "source/GoogleSans/*.glyphs"

jobs:
  build-incoming-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ steps.config.outputs.projectname }} source repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "requirements*.txt"
      - name: Install Python build dependencies
        uses: py-actions/py-dependency-install@v2
        with:
          update-wheel: "true"
          update-setuptools: "true"
      - name: Generate Glyphs.app file
        run: |
          make gs-vf-vendor
      - uses: actions/upload-artifact@v2
        with:
          name: "Built variable fonts"
          path: "source/GoogleSans/staging/**/*.ttf"
          retention-days: 1
