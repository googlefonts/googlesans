name: 'CI/CD'

on:
  # Run on pushes to the repository's own branches only when one of the
  # conditions below matches. Typically, new things should be added via PRs.
  push:  
    # Sequence of patterns matched against refs/heads:
    branches:
      - main # Push events directly to the main branch
      # The following two directives are for making "build" branches where all
      # jobs should be run. Note: it's best not to open PRs for these branches
      # to avoid jobs running twice (one for the push event, the other for the
      # pull_request).
      - "build/**" # Push events to branches matching refs/heads/build/[ANYTHING]
      - "build-*" # Push events to branches matching refs/heads/build-[ANYTHING]
  release:
    # A release, pre-release, or draft of a release was published
    types: [published]
  # Run on all PRs. Runs a limited set of jobs by default to save time.
  pull_request:

jobs:
  lint-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python v3.12 environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Lint UFO sources
        run: |
          pip install ufolint
          ufolint source/GoogleSans/*.ufo

  lint-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python v3.12 environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Lint scripts
        run: |
          pip install flake8
          flake8

  build-variable:
    runs-on: googlefonts-64cores-256GB
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python v3.12 environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Build variable fonts
        run: |
          make setup
          . .venv/bin/activate && make -j gs-vf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: variable-fonts
          path: |
            build/GoogleSans/variable
            build/GoogleSans/.intermediate
          include-hidden-files: true

  check-variable:
    needs:
      - build-variable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python v3.12 environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Setup fontspector
        uses: fonttools/setup-fontspector@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: variable-fonts
          path: 'build/GoogleSans'
      - name: Fontspector tests
        run: make test-vf
      - name: OpenType Sanitizer checks
        uses: f-actions/opentype-sanitizer@d5603373a9adccd136dd48b037b9b5178b485bea # v4.0.0
        with:
          path: 'build/GoogleSans/variable/*.ttf'
      - name: File size analysis
        run: |
          pip install --upgrade font-size
          font-size build/GoogleSans/variable/*.ttf

  build-statics:
    # Skip running in PRs to save time and resources. Create a "build-*" branch
    # to build all outside a release.
    if: github.event_name != 'pull_request'
    needs:
      - build-variable
    runs-on: googlefonts-64cores-256GB
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python v3.12 environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: variable-fonts
          path: 'build/GoogleSans'
      - name: Build static fonts
        run: |
          make setup
          . .venv/bin/activate && make -j gs-static
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-fonts
          path: 'build/GoogleSans/static'

  check-statics:
    needs:
      - build-statics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python v3.12 environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Setup fontspector
        uses: fonttools/setup-fontspector@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-fonts
          path: 'build/GoogleSans/static'
      - name: Fontspector tests
        run: make test-static
      - name: OpenType Sanitizer checks
        uses: f-actions/opentype-sanitizer@d5603373a9adccd136dd48b037b9b5178b485bea # v4.0.0
        with:
          path: 'build/GoogleSans/static/*.ttf'
      - name: File size analysis
        run: |
          pip install --upgrade font-size
          font-size build/GoogleSans/static/*.ttf

  build-android:
    # Skip running in PRs to save time and resources. Create a "build-*" branch
    # to build all outside a release.
    if: github.event_name != 'pull_request'
    needs:
      - build-variable
    runs-on: googlefonts-64cores-256GB
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python v3.12 environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: variable-fonts
          path: 'build/GoogleSans'
      - name: Build Android fonts
        run: |
          make setup
          . .venv/bin/activate && make -j gs-android
      - name: Upload Android fonts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-fonts
          path: build/GoogleSans/android

  build-and-check-figma:
    # Skip running in PRs to save time and resources. Create a 'build-*' branch
    # to build all outside a release.
    if: github.event_name != 'pull_request'
    needs:
      - build-variable
    runs-on: googlefonts-64cores-256GB
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python v3.12 environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Setup fontspector
        uses: fonttools/setup-fontspector@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: variable-fonts
          path: 'build/GoogleSans'
      - name: Build Figma fonts
        run: |
          make setup
          . .venv/bin/activate && make -j gs-figma
      - name: Fontspector tests
        run: make test-figma
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: figma-fonts
          path: 'build/GoogleSans/figma'

  release:
    if: ${{ github.event_name == 'release' }}
    needs:
      - build-variable
      - check-variable
      - build-statics
      - check-statics
      - build-android
      - build-and-check-figma
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Permission is required for releasing
    permissions:
      contents: write
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python v3.12 environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Save tag name
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
      - name: Download variable fonts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: variable-fonts
          path: 'build/GoogleSans'
      - name: Download static fonts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-fonts
          path: 'build/GoogleSans/static'
      - name: Download Android fonts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-fonts
          path: 'build/GoogleSans/android'
      - name: Download Figma fonts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: figma-fonts
          path: 'build/GoogleSans/figma'
      - name: Delete intermediate VFs
        run: rm -rf build/GoogleSans/.intermediate
      - name: Setup venv
        run: make setup
      - name: Set post table to v3 for all fonts
        run: |
          find build/GoogleSans -type f -iname '*.ttf' \
            -exec .venv/bin/python scripts/post_v3.py {} \;
      - name: Create build artifact zip archive
        id: release-archives
        run: |
          zip_name="GoogleSans-${STEPS_VARS_OUTPUTS_TAG}.zip"
          echo "zip-name=$zip_name" >> "$GITHUB_OUTPUT"
          zip -9 "$zip_name" -r build/GoogleSans
        env:
          STEPS_VARS_OUTPUTS_TAG: ${{ steps.vars.outputs.tag }}
      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # latest
        with:
          file: ${{ steps.release-archives.outputs.zip-name }}
          overwrite: true
