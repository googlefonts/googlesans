name: Diffenate builds

on:
  workflow_dispatch:
    inputs:
      before:
        description: The 'before' git reference (tag, branch, or commit)
        required: true
      after:
        description: The 'after' git reference (tag, branch, or commit)
        required: true
      all-masters:
        description: Check all masters? (--masters)
        type: boolean

permissions:
  contents: read

jobs:
  build-before:
    runs-on: googlefonts-64cores-256GB
    timeout-minutes: 10
    steps:
    - name: Checkout ${{ inputs.before }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ inputs.before }}
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version-file: .github/workflows/python-version.txt
        cache: pip
    - name: Set up uv and enable caching
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        # https://docs.zizmor.sh/audits/#cache-poisoning
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
        cache-dependency-glob: |
          requirements*.txt
          requirements*.in
    - name: Build fonts
      run: make build
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: Before VFs (${{ inputs.before }})
        path: fonts/variable
        if-no-files-found: error
  build-after:
    runs-on: googlefonts-64cores-256GB
    timeout-minutes: 10
    steps:
    - name: Checkout ${{ inputs.after }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ inputs.after }}
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version-file: .github/workflows/python-version.txt
    - name: Set up uv and enable caching
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        # https://docs.zizmor.sh/audits/#cache-poisoning
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
        cache-dependency-glob: |
          requirements*.txt
          requirements*.in
    - name: Build fonts
      run: make build
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: After VFs (${{ inputs.after }})
        path: fonts/variable
        if-no-files-found: error
  diffenate:
    runs-on: googlefonts-64cores-256GB
    timeout-minutes: 20
    needs:
    - build-before
    - build-after
    steps:
    - name: Download before fonts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: Before VFs (${{ inputs.before }})
        path: before
    - name: Download after fonts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: After VFs (${{ inputs.after }})
        path: after
    - name: Install diffenator3
      uses: notofonts/install-diffenator3-action@20563461fec9ee21c9dac5c7476fd57b9095880f  # main
    - name: Run diffenator3
      env:
        INPUT_ALL_MASTERS: ${{ inputs.all-masters }}
      run: |
        mkdir -p diffenator_report
        if [[ "${INPUT_ALL_MASTERS}" == "true" ]] ; then
          echo "Checking masters"
          LOCATIONS_ARG="--masters"
        else
          echo "Checking instances"
          LOCATIONS_ARG=""
        fi
        diffenator3 before/GoogleSans\[*.ttf after/GoogleSans\[*.ttf \
          $LOCATIONS_ARG --html --output diffenator_report_upright
        diffenator3 before/GoogleSans-Italic*.ttf after/GoogleSans-Italic*.ttf \
          $LOCATIONS_ARG --html --output diffenator_report_italic
    - name: Upload diffenator report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: Diffenator3 report (${{ inputs.before }} vs ${{ inputs.after }})
        path: |
          diffenator_report_upright
          diffenator_report_italic
        if-no-files-found: error
        compression-level: 9
