name: Python script lints

on: [push]

jobs:
  flake8:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    name: flake8 lints
    steps:
      - name: Check out source repository
        uses: actions/checkout@v3
      - name: Set up Python v${{ matrix.python-version }} environment
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: flake8 lint of Python sources
        uses: py-actions/flake8@v1 # uses flake8 configuration in repository setup.cfg file
        with:
          flake8-version: "latest"
