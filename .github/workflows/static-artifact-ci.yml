name: Static CI

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - main # Push events on main branch
      - "build/**" # Push events to branches matching refs/heads/build/[ANYTHING]
      - "build-*" # Push events to branches matching refs/heads/build-[ANYTHING]
  # Manual trigger
  workflow_dispatch:

jobs:
  static-font-ci-job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    name: Google Sans static font build CI
    steps:
      - name: Configuration
        id: config
        uses: f-actions/font-setup@master
        with:
          projectname: "Google Sans"
          sourcepath: "source"
          buildpath: "build/GoogleSans/static/*.ttf" # static font build path
          readmepath: "README.md"
          changelogpath: "CHANGELOG.md"
          dependpath: "requirements-dev.txt"
          py-version: ${{ matrix.python-version }}
          buildcommand: "make -j gs-static" # static font make target
      - name: Check out ${{ steps.config.outputs.projectname }} source repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ steps.config.outputs.py-version }}
          cache: "pip"
          cache-dependency-path: "requirements*.txt"
      - name: Install Python build dependencies
        uses: py-actions/py-dependency-install@v2
        with:
          update-wheel: "true"
          update-setuptools: "true"
          path: ${{ steps.config.outputs.dependpath }}
      - name: Build fonts
        run: ${{ steps.config.outputs.buildcommand }}
      - name: Font Bakery GS profile tests
        uses: f-actions/font-bakery@v1
        with:
          version: "latest"
          subcmd: "check-profile"
          args: "-C --loglevel WARN qa/check-googlesans.py"
          path: "${{ steps.config.outputs.buildpath }}"
      - name: Font Bakery character set profile tests
        uses: f-actions/font-bakery@v1
        with:
          version: "latest"
          subcmd: "check-profile"
          args: "-C --loglevel WARN qa/check-charset.py"
          path: "${{ steps.config.outputs.buildpath }}"
      - name: Font Bakery feature tag and shaping tests
        uses: f-actions/font-bakery@v1
        with:
          version: "latest"
          subcmd: "check-profile"
          args: "-C --loglevel WARN qa/check-fea.py"
          path: "${{ steps.config.outputs.buildpath }}"
      - name: OpenType Sanitizer checks
        uses: f-actions/opentype-sanitizer@v1
        with:
          path: "${{ steps.config.outputs.buildpath }}"
      - name: File size analysis
        run: |
          pip install --upgrade font-size
          font-size ${{ steps.config.outputs.buildpath }}
